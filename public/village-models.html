<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1d2733" />
<title>Low-Poly Village — 3D Model Gallery</title>
<style>
  :root { --bg0:#26333f; --bg1:#161d25; --panel:rgba(18,24,31,.82); --ink:#eef2f6; --muted:#9fb0c0; --accent:#4d7fd6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); }
  #c { display:block; width:100vw; height:100vh; touch-action:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:10px 12px 8px; z-index:5;
    background:linear-gradient(180deg, rgba(10,14,19,.78), rgba(10,14,19,0)); pointer-events:none; }
  .top h1 { margin:0; font-size:16px; letter-spacing:.3px; font-weight:700; }
  .top h1 span { color:var(--accent); }
  .top p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  .caption { position:fixed; left:0; right:0; bottom:78px; text-align:center; z-index:5;
    font-size:13px; color:var(--muted); pointer-events:none; padding:0 16px; }
  .caption b { color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:10px 10px 14px;
    background:linear-gradient(0deg, rgba(10,14,19,.92), rgba(10,14,19,0));
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .bar::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid rgba(255,255,255,.12); background:var(--panel);
    color:var(--ink); font-size:13px; font-weight:600; padding:9px 13px; border-radius:999px;
    white-space:nowrap; cursor:pointer; transition:.15s; }
  .chip:hover { border-color:rgba(255,255,255,.3); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ctrl { position:fixed; top:10px; right:10px; z-index:6; display:flex; gap:8px; }
  .ctrl button { border:1px solid rgba(255,255,255,.14); background:var(--panel); color:var(--ink);
    width:40px; height:40px; border-radius:10px; font-size:17px; cursor:pointer; }
  .ctrl button.on { background:var(--accent); border-color:var(--accent); }
  .hint { position:fixed; left:0; right:0; bottom:120px; text-align:center; font-size:11px; color:var(--muted);
    z-index:4; pointer-events:none; opacity:.85; }
  .err { position:fixed; inset:0; display:none; place-items:center; padding:24px; text-align:center;
    color:#ffd7d7; font-size:14px; line-height:1.5; z-index:10; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="top">
    <h1>Low-Poly Village <span>· 3D Models</span></h1>
    <p>Drag / swipe to orbit · pinch or scroll to zoom</p>
  </div>
  <div class="ctrl">
    <button id="spin" class="on" title="Auto-rotate">&#10227;</button>
    <button id="reset" title="Reset view">&#9678;</button>
  </div>
  <div class="caption" id="caption"></div>
  <div class="hint" id="hint">Pick a model below</div>
  <div class="bar" id="bar"></div>
  <div class="err" id="err"></div>

  <script>
    // Fallback for browsers without ES-module / import-map support: if the
    // module below never runs, show a clear message instead of a blank canvas.
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.__villageReady) {
          var el = document.getElementById('err');
          el.style.display = 'grid';
          el.innerHTML = 'Could not start the 3D engine.<br>Open this file in an up-to-date browser (Chrome, or Safari on iOS&nbsp;16.4+) with an internet connection.';
        }
      }, 9000);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  (function(){
  'use strict';
  function boot(){

  // ---------- palette ----------
  const COL = {
    grass:0x83b056, grassDark:0x6f9b46, soil:0x70512f, soilDark:0x5a3f24,
    plaster:0xe7dabc, plaster2:0xd8c79e, timber:0x5e3a22, timberDark:0x46291650,
    log:0x9a6336, logEnd:0xc79a6a, plank:0xc59a5e, roofBlue:0x46699a, roofBlueDk:0x36507c,
    roofRed:0xb14730, thatch:0xd8b24a, thatchDk:0xc49a36, stone:0x9b9b95, stoneDk:0x82827c,
    flag:0x2f63b8, flagPole:0x4a3320, gold:0xf2c64e, iron:0x565b62, wheat:0xd9b24a,
    water:0x3b78b0, skin:0xd9a273, tunic:0xb9854f, pants:0x39477a, hat:0x2f63b8,
    metal:0x6e757c, leaf:0x3f7a3a, leafDk:0x356a31, leafLt:0x4f9147, rock:0x8d8d88,
    crate:0xb07d44, fire:0xff7b2e, eye:0x2b2b33
  };

  // ---------- material + primitive helpers ----------
  const _mats = new Map();
  function mat(color, {flat=true, rough=0.95, metal=0.0, transparent=false, opacity=1}={}){
    const key = `${color}|${flat}|${rough}|${metal}|${transparent}|${opacity}`;
    if(_mats.has(key) && !transparent) return _mats.get(key);
    const m = new THREE.MeshStandardMaterial({ color, flatShading:flat, roughness:rough, metalness:metal, transparent, opacity });
    if(!transparent) _mats.set(key, m);
    return m;
  }
  function mesh(geo, color, opts){ const m = new THREE.Mesh(geo, mat(color, opts)); m.castShadow=true; m.receiveShadow=true; return m; }
  function box(w,h,d,color,opts){ return mesh(new THREE.BoxGeometry(w,h,d), color, opts); }
  function cyl(rt,rb,h,seg,color,opts){ return mesh(new THREE.CylinderGeometry(rt,rb,h,seg), color, opts); }
  function cone(r,h,seg,color,opts){ return mesh(new THREE.ConeGeometry(r,h,seg), color, opts); }
  function sphere(r,color,opts){ return mesh(new THREE.IcosahedronGeometry(r,0), color, opts); }
  function ball(r,color,opts){ return mesh(new THREE.SphereGeometry(r,16,12), color, opts); }
  function dome(r,color,opts){ return mesh(new THREE.SphereGeometry(r,16,10,0,Math.PI*2,0,Math.PI*0.55), color, opts); }
  function put(parent, m, x=0,y=0,z=0, rx=0,ry=0,rz=0){ m.position.set(x,y,z); m.rotation.set(rx,ry,rz); parent.add(m); return m; }

  // ---------- shared building blocks ----------
  function baseTile(group, size=4.4, h=0.55, top=COL.grass){
    const soil = box(size, h, size, COL.soil); put(group, soil, 0, h/2, 0);
    // tapered illusion: thin darker rim
    const grass = box(size*1.02, 0.2, size*1.02, top); put(group, grass, 0, h+0.08, 0);
    // a couple of grass tufts / pebbles
    for(let i=0;i<4;i++){
      const a = Math.random()*Math.PI*2, r = size*0.36;
      put(group, sphere(0.07+Math.random()*0.05, COL.stone), Math.cos(a)*r, h+0.2, Math.sin(a)*r);
    }
    return h + 0.18; // returns Y of grass top surface
  }

  // gable roof: two sloped slabs, ridge runs along Z (depth)
  function gableRoof(group, w, d, roofH, color, baseY, overhang=0.45, thick=0.16){
    const half = w/2 + overhang;
    const slant = Math.hypot(half, roofH);
    const ang = Math.atan2(roofH, half);
    const dd = d + overhang*1.4;
    const L = box(slant, thick, dd, color); put(group, L, -half/2, baseY + roofH/2, 0, 0,0, ang);
    const R = box(slant, thick, dd, color); put(group, R, half/2, baseY + roofH/2, 0, 0,0, -ang);
    // ridge cap
    const ridge = box(0.22, 0.22, dd, color); put(group, ridge, 0, baseY+roofH+0.03, 0, Math.PI/4,0,0);
    return baseY + roofH;
  }
  function gableEnds(group, w, roofH, color, baseY, depth, t=0.12){
    const shape = new THREE.Shape();
    shape.moveTo(-w/2,0); shape.lineTo(w/2,0); shape.lineTo(0,roofH); shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, {depth:t, bevelEnabled:false});
    [depth/2 - t/2, -depth/2 - t/2].forEach(z=>{
      const m = new THREE.Mesh(geo, mat(color)); m.castShadow=true; m.receiveShadow=true;
      m.position.set(0, baseY, z); group.add(m);
    });
  }

  // timber-frame walls: plaster box + dark corner posts + beams
  function timberWalls(group, w, h, d, baseY, plaster=COL.plaster){
    put(group, box(w, h, d, plaster), 0, baseY + h/2, 0);
    const p = 0.16;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
      put(group, box(p, h, p, COL.timber), sx*(w/2-p/2), baseY+h/2, sz*(d/2-p/2));
    });
    // top + bottom beams (front/back)
    [d/2-0.04, -d/2+0.04].forEach(z=>{
      put(group, box(w, p, 0.1, COL.timber), 0, baseY+h-p/2, z);
      put(group, box(w, p, 0.1, COL.timber), 0, baseY+p/2, z);
      put(group, box(p, h, 0.1, COL.timber), 0, baseY+h/2, z); // mid stud
    });
  }

  function door(group, baseY, z, w=0.6, h=1.0){ put(group, box(w, h, 0.12, COL.timber), 0, baseY+h/2, z); }
  function windowPane(group, x, y, z, s=0.42){ put(group, box(s, s, 0.1, COL.roofBlueDk), x, y, z); }
  function chimney(group, x, baseY, z, h=0.9){
    put(group, box(0.4, h, 0.4, COL.stone), x, baseY+h/2, z);
    smokeStack(group, x, baseY+h+0.1, z);
  }
  function smokeStack(group, x, y, z){
    for(let i=0;i<4;i++){
      const p = sphere(0.16+i*0.05, 0xdfe5ea, {flat:true, transparent:true, opacity:0.5-i*0.09});
      p.castShadow=false; put(group, p, x, y+i*0.4, z);
      p.userData.smoke = { base:y, range:1.8, speed:0.5, off:i*0.45, x, z, amp:0.18 };
    }
  }
  function flag(group, x, baseY, z, height=2.2){
    put(group, cyl(0.05,0.05,height,6,COL.flagPole), x, baseY+height/2, z);
    const f = box(0.7,0.5,0.04, COL.flag); put(group, f, x+0.4, baseY+height-0.35, z);
    f.userData.wave = { base:0, amp:0.18, speed:2.2, axis:'y', pivotX:x };
    // emblem
    put(group, box(0.18,0.18,0.02, COL.gold), x+0.4, baseY+height-0.35, z+0.03);
  }
  function logPile(group, x, y, z, n=3, dir='z'){
    for(let i=0;i<n;i++){
      const l = cyl(0.16,0.16,1.3,8,COL.log);
      if(dir==='z'){ l.rotation.x = Math.PI/2; put(group, l, x, y+0.16, z + (i-(n-1)/2)*0.36); }
      else { l.rotation.z = Math.PI/2; put(group, l, x + (i-(n-1)/2)*0.36, y+0.16, z); }
    }
    // second row
    for(let i=0;i<n-1;i++){
      const l = cyl(0.16,0.16,1.3,8,COL.log);
      if(dir==='z'){ l.rotation.x = Math.PI/2; put(group, l, x, y+0.48, z + (i-(n-2)/2)*0.36); }
      else { l.rotation.z = Math.PI/2; put(group, l, x + (i-(n-2)/2)*0.36, y+0.48, z); }
    }
  }
  function plankPile(group, x, y, z, n=4){
    for(let i=0;i<n;i++) put(group, box(1.3,0.1,0.5,COL.plank), x, y+0.06+i*0.13, z, 0, 0.04*i, 0);
  }
  function barrel(group, x, y, z){
    put(group, cyl(0.28,0.32,0.6,10,COL.log), x, y+0.3, z);
    put(group, cyl(0.34,0.34,0.12,10,COL.metal,{rough:0.5,metal:0.4}), x, y+0.18, z);
    put(group, cyl(0.34,0.34,0.12,10,COL.metal,{rough:0.5,metal:0.4}), x, y+0.45, z);
  }
  function crate(group, x, y, z, s=0.55){
    put(group, box(s,s,s,COL.crate), x, y+s/2, z);
    put(group, box(s*1.02,0.08,0.08,COL.timber), x, y+s*0.75, z);
    put(group, box(s*1.02,0.08,0.08,COL.timber), x, y+s*0.25, z);
  }
  function pine(group, x, y, z, scale=1){
    put(group, cyl(0.14*scale,0.18*scale,0.7*scale,7,COL.log), x, y+0.35*scale, z);
    const cols=[COL.leafDk,COL.leaf,COL.leafLt];
    for(let i=0;i<3;i++) put(group, cone((0.85-i*0.22)*scale, (1.0)*scale, 7, cols[i]), x, y+(0.85+i*0.55)*scale, z);
  }
  function boulder(group, x, y, z, s=1){
    const b = sphere(s, COL.rock); b.scale.set(1,0.75,1.1); put(group, b, x, y+s*0.55, z, Math.random(),Math.random(),Math.random());
    return b;
  }
  // cute abstract unit: cone body, round (spherical) head + hands, a role hat
  // and an optional held prop. opts = { cloak, hat, accent, prop, scale }.
  const soft = {flat:false};
  function villager(opts){
    opts = opts || {};
    const cloak = opts.cloak || COL.tunic;
    const g = new THREE.Group();
    put(g, cone(0.46, 1.0, 18, cloak, soft), 0, 0.5, 0);       // body / cloak
    put(g, ball(0.27, COL.skin, soft), 0, 1.05, 0);            // round head
    put(g, ball(0.055, COL.eye, soft), -0.1, 1.08, 0.25);      // eyes
    put(g, ball(0.055, COL.eye, soft),  0.1, 1.08, 0.25);
    addHat(g, opts.hat, opts.accent);
    // floating round hands (each a group so it can bob and hold a prop)
    const lh = new THREE.Group(); put(lh, ball(0.1, COL.skin, soft)); put(g, lh, -0.5, 0.55, 0.12);
    lh.userData.hover = { base:0.55, amp:0.07, speed:3.0, phase:0 };
    const rh = new THREE.Group(); put(rh, ball(0.1, COL.skin, soft)); put(g, rh, 0.5, 0.55, 0.12);
    rh.userData.hover = { base:0.55, amp:0.07, speed:3.0, phase:Math.PI };
    if(opts.prop) addProp(rh, lh, opts.prop);
    g.scale.setScalar(opts.scale || 1);
    return g;
  }
  function addHat(g, type, accent){
    accent = accent || COL.hat;
    if(!type || type==='point'){ put(g, cone(0.27,0.46,16, accent, soft), 0,1.45,0); put(g, ball(0.07, accent, soft), 0,1.72,0); }
    else if(type==='cap'){ put(g, dome(0.29, accent, soft), 0,1.16,0); put(g, box(0.34,0.05,0.2, accent, soft), 0,1.12,0.16); }
    else if(type==='chef'){ put(g, cyl(0.22,0.24,0.18,16, 0xf3efe6, soft), 0,1.4,0); put(g, ball(0.26, 0xf8f6f0, soft), 0,1.62,0); }
    else if(type==='straw'){ put(g, cone(0.56,0.16,18, COL.thatch, soft), 0,1.34,0); put(g, cone(0.28,0.24,16, COL.thatchDk, soft), 0,1.46,0); }
    else if(type==='helmet'){ put(g, dome(0.3, COL.metal, {flat:false,metal:0.35,rough:0.45}), 0,1.12,0); put(g, box(0.07,0.3,0.05, accent, soft), 0,1.36,0); }
    else if(type==='minerhelmet'){ put(g, dome(0.3, COL.metal, {flat:false,metal:0.35,rough:0.45}), 0,1.12,0); put(g, ball(0.06, 0xfff3b0, soft), 0,1.2,0.28); }
    else if(type==='hood'){ put(g, cone(0.34,0.55,16, accent, soft), 0,1.42,0); }
  }
  function addProp(rh, lh, type){
    const m = {flat:false, metal:0.4, rough:0.4};
    if(type==='hammer'){ put(rh, cyl(0.035,0.035,0.45,8,COL.log,soft), 0,-0.05,0.06, 0.4,0,0); put(rh, box(0.18,0.12,0.12, COL.metal, m), 0,0.14,0.22); }
    else if(type==='axe'){ put(rh, cyl(0.035,0.035,0.5,8,COL.log,soft), 0,-0.08,0.06, 0.35,0,0); put(rh, box(0.05,0.2,0.24, COL.metal, m), 0.02,0.16,0.24, 0.35,0,0); }
    else if(type==='pickaxe'){ put(rh, cyl(0.035,0.035,0.5,8,COL.log,soft), 0,-0.05,0.06, 0.45,0,0); put(rh, box(0.5,0.07,0.07, COL.metal, m), 0,0.18,0.22, 0.45,0,0); }
    else if(type==='bread'){ const b=ball(0.16,0xcb8e4e,soft); b.scale.set(1.5,0.85,0.95); put(rh, b, 0.02,0.06,0.2); put(rh, box(0.04,0.02,0.18,0xa86e36,soft), 0.02,0.2,0.2); }
    else if(type==='wheat'){ for(let i=0;i<6;i++){ const a=i/6*6.28; put(rh, box(0.04,0.42,0.04, COL.wheat, soft), 0.02+Math.cos(a)*0.06, 0.2, 0.18+Math.sin(a)*0.06, Math.cos(a)*0.18,0,Math.sin(a)*0.18); } }
    else if(type==='rod'){ put(rh, cyl(0.02,0.028,0.85,6, COL.log, soft), 0.02,0.22,0.06, -0.5,0,0); put(rh, cyl(0.005,0.005,0.4,4, COL.eye, soft), 0.02,0.0,0.55); put(rh, ball(0.05, 0x8fb8c8, soft), 0.02,-0.18,0.6); }
    else if(type==='bow'){ const bow=mesh(new THREE.TorusGeometry(0.3,0.025,6,18,Math.PI*1.25), COL.log, soft); put(lh, bow, 0,0,0.06, 0, Math.PI/2, Math.PI*0.375); put(lh, cyl(0.006,0.006,0.56,4, 0xddd6c4, soft), 0,0,0.06); }
    else if(type==='soldier'){ put(rh, box(0.05,0.5,0.07, COL.metal, {flat:false,metal:0.5,rough:0.3}), 0.04,0.32,0.08); put(rh, box(0.22,0.05,0.09, COL.gold, m), 0.04,0.08,0.08); put(rh, cyl(0.03,0.03,0.12,6, COL.timber, soft), 0.04,-0.02,0.08); const sh=cyl(0.26,0.26,0.06,10, COL.flag, soft); sh.rotation.x=Math.PI/2; put(lh, sh, 0,0,0.13); put(lh, ball(0.07, COL.gold, soft), 0,0,0.17); }
  }

  // ---------- model builders ----------
  const MODELS = {};
  const add = (name, caption, fn) => { MODELS[name] = { caption, fn }; };

  add('Village House', 'Tudor cottage with blue slate roof', g=>{
    const y = baseTile(g);
    timberWalls(g, 2.6, 1.5, 2.0, y);
    const top = y + 1.5;
    gableEnds(g, 2.6, 1.3, COL.plaster2, top, 2.0);
    gableRoof(g, 2.6, 2.0, 1.3, COL.roofBlue, top);
    door(g, y, 1.01);
    windowPane(g, -0.8, y+0.9, 1.01); windowPane(g, 0.8, y+0.9, 1.01);
    chimney(g, 0.85, top-0.1, -0.4);
  });

  add('Lumber Camp', 'Open timber frame, log piles & saw', g=>{
    const y = baseTile(g, 4.8);
    // open frame posts
    [[-1.3,-1.0],[1.3,-1.0],[-1.3,1.0],[1.3,1.0]].forEach(([x,z])=> put(g, box(0.22,1.7,0.22,COL.log), x, y+0.85, z));
    [-1.0,1.0].forEach(z=> put(g, box(2.84,0.2,0.2,COL.timber), 0, y+1.7, z));
    gableEnds(g, 2.84, 0.9, COL.timber, y+1.7, 2.2, 0.1);
    gableRoof(g, 2.84, 2.2, 0.9, COL.roofBlue, y+1.7, 0.4);
    logPile(g, -1.6, y, 0.6, 3, 'z');
    // sawbuck with a log
    put(g, box(0.1,0.7,0.1,COL.timber), 1.3, y+0.35, -0.2, 0,0, 0.4);
    put(g, box(0.1,0.7,0.1,COL.timber), 1.3, y+0.35, -0.2, 0,0,-0.4);
    const sl = cyl(0.18,0.18,1.4,8,COL.log); sl.rotation.x=Math.PI/2; put(g, sl, 1.3, y+0.7, -0.2);
    flag(g, 2.0, y, 1.4, 2.0);
  });

  add('Sawmill', 'Water wheel turns logs into planks', g=>{
    const y = baseTile(g, 4.8);
    timberWalls(g, 2.4, 1.4, 1.8, y, COL.plaster2);
    const top = y+1.4;
    gableEnds(g, 2.4, 1.1, COL.plaster, top, 1.8);
    gableRoof(g, 2.4, 1.8, 1.1, COL.roofBlue, top);
    // water wheel on the side
    const wheelHub = new THREE.Group();
    put(g, wheelHub, 1.7, y+0.85, 0);
    const ring = mesh(new THREE.TorusGeometry(0.85,0.1,6,16), COL.log); ring.rotation.y=Math.PI/2; wheelHub.add(ring);
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;
      const spoke = box(0.08,1.6,0.08,COL.timber); spoke.rotation.x=a; wheelHub.add(spoke);
      const pad = box(0.12,0.36,0.5,COL.log); put(wheelHub, pad, 0, Math.cos(a)*0.85, Math.sin(a)*0.85, a,0,0);
    }
    wheelHub.userData.spin = { axis:'x', speed:0.9 };
    // water trough

  // ---------- stylized post-processing (blur + bloom + grade + vignette + grain) ----------
  // Self-contained: render scene to a target, then a fullscreen shader. Fails safe to
  // a plain render if anything goes wrong, so the worst case is "no stylization".
  const POST_FRAG = [
    'varying vec2 vUv;',
    'uniform sampler2D tDiffuse; uniform vec2 uRes;',
    'uniform float uTime, uGrain, uVignette, uBloom;',
    'float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }',
    'vec3 tap(vec2 uv, vec2 t){',
    '  vec3 c=vec3(0.0); float w=0.0;',
    '  for(int x=-1;x<=1;x++){ for(int y=-1;y<=1;y++){',
    '    vec2 o=vec2(float(x),float(y))*t;',
    '    float k=(x==0&&y==0)?4.0:((x==0||y==0)?2.0:1.0);',
    '    c+=texture2D(tDiffuse,uv+o).rgb*k; w+=k; }}',
    '  return c/w;',
    '}',
    'void main(){',
    '  vec2 uv=vUv; vec2 t=1.0/uRes;',
    '  vec3 sharp=texture2D(tDiffuse,uv).rgb;',
    '  vec3 blur=tap(uv,t);',
    '  float d=distance(uv,vec2(0.5));',
    '  float edge=smoothstep(0.30,0.95,d);',
    '  vec3 col=mix(sharp,blur,edge*0.75);',          // soft focus toward the edges
    '  vec3 bright=max(blur-0.62,0.0);',
    '  col+=bright*uBloom;',                           // gentle bloom on bright bits (fire, gold, sky)
    '  float luma=dot(col,vec3(0.299,0.587,0.114));',
    '  col*=mix(vec3(0.90,0.96,1.07),vec3(1.07,1.01,0.92),smoothstep(0.05,0.65,luma));', // cool shadows / warm highs
    '  col=pow(clamp(col,0.0,1.0),vec3(1.0/2.2));',    // sRGB encode (keeps the palette)
    '  col*=1.0-uVignette*smoothstep(0.45,1.18,d);',   // vignette
    '  float g=hash(uv*uRes*0.5+fract(uTime)*97.0);',
    '  col+=(g-0.5)*uGrain;',                          // film grain
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  function makePost(){
    const dpr = renderer.getPixelRatio();
    const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, type:THREE.UnsignedByteType });
    const pScene = new THREE.Scene();
    const pCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const uniforms = {
      tDiffuse:{ value:rt.texture }, uRes:{ value:new THREE.Vector2(2,2) }, uTime:{ value:0 },
      uGrain:{ value:0.07 }, uVignette:{ value:0.42 }, uBloom:{ value:0.5 }
    };
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
      uniforms, depthTest:false, depthWrite:false,
      vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
      fragmentShader: POST_FRAG
    }));
    pScene.add(quad);
    return {
      setSize(w,h){ rt.setSize(Math.max(2,Math.floor(w*dpr)), Math.max(2,Math.floor(h*dpr))); uniforms.uRes.value.set(rt.width, rt.height); },
      render(time){
        uniforms.uTime.value = time;
        renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, camera);
        renderer.setRenderTarget(null); renderer.render(pScene, pCam);
      }
    };
  }
  let post = null;
  try { post = makePost(); } catch(e){ post = null; }

  // ---------- model framing / swapping ----------
  const TARGET = 6.2;
  let current = null;
  const clock = new THREE.Clock();

  function frame(group){
    const bb = new THREE.Box3().setFromObject(group);
    const size = new THREE.Vector3(); bb.getSize(size);
    const center = new THREE.Vector3(); bb.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const s = TARGET / maxDim;
    group.scale.setScalar(s);
    // recompute after scaling
    const bb2 = new THREE.Box3().setFromObject(group);
    const c2 = new THREE.Vector3(); bb2.getCenter(c2);
    group.position.x -= c2.x; group.position.z -= c2.z;
    group.position.y -= bb2.min.y; // sit on ground
  }

  function show(name){
    if(current){ scene.remove(current); }
    const group = new THREE.Group();
    MODELS[name].fn(group);
    frame(group);
    scene.add(group);
    current = group;
    document.getElementById('caption').innerHTML = `<b>${name}</b> — ${MODELS[name].caption}`;
    document.getElementById('hint').style.display='none';
    // active chip
    [...document.querySelectorAll('.chip')].forEach(c=> c.classList.toggle('active', c.dataset.name===name));
    // frame target height
    const bb = new THREE.Box3().setFromObject(group); const sz=new THREE.Vector3(); bb.getSize(sz);
    controls.target.set(0, Math.min(sz.y*0.45, 3.0), 0);
  }

  // build chips
  const bar = document.getElementById('bar');
  Object.keys(MODELS).forEach((name,i)=>{
    const b = document.createElement('button'); b.className='chip'; b.textContent=name; b.dataset.name=name;
    b.onclick = ()=> show(name); bar.appendChild(b);
  });

  // controls
  const spinBtn = document.getElementById('spin');
  spinBtn.onclick = ()=>{ controls.autoRotate = !controls.autoRotate; spinBtn.classList.toggle('on', controls.autoRotate); };
  document.getElementById('reset').onclick = ()=>{ camera.position.set(7.5,6.0,9.0); controls.target.set(0,2.0,0); };

  // ---------- animation ----------
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime(); const dt = Math.min(clock.getDelta(), 0.05);
    if(current){
      current.traverse(o=>{
        const u = o.userData;
        if(u.spin) o.rotation[u.spin.axis] += u.spin.speed*dt;
        if(u.wave) o.rotation[u.wave.axis] = Math.sin(t*u.wave.speed)*u.wave.amp;
        if(u.hover) o.position.y = u.hover.base + Math.sin(t*u.hover.speed + (u.hover.phase||0))*u.hover.amp;
        if(u.flicker){ const sx=u.flicker.base+Math.sin(t*u.flicker.speed)*u.flicker.amp; o.scale.set(1,sx/0.5,1); }
        if(u.smoke){ const k=((t*u.smoke.speed+u.smoke.off)%1); o.position.y = u.smoke.base + k*u.smoke.range; if(o.material) o.material.opacity = Math.max(0,0.5*(1-k)); }
      });
    }
    controls.update();
    if(post) post.render(t); else renderer.render(scene, camera);
  }

  function resize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if(post) post.setSize(innerWidth, innerHeight); }
  addEventListener('resize', resize); resize();

  // error surface (e.g. 3D engine failed to load)
  addEventListener('error', e=>{ const el=document.getElementById('err'); el.style.display='grid'; el.textContent='Could not load 3D engine. Open this file in a modern browser (Chrome/Safari) with internet access.'; });

  show(Object.keys(MODELS)[0]);
  animate();
  window.__villageReady = true;
  } // end boot

  // Wait until the Three.js libraries have loaded (robust to script order),
  // then start. The load-time fallback above shows a message if they never do.
  (function wait(){
    if (typeof THREE !== 'undefined' && THREE.OrbitControls) boot();
    else setTimeout(wait, 40);
  })();
  })();
  </script>
